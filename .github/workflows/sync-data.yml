name: Sync game data

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_data.py"
      - "scripts/test_sync_probe_parser.py"
      - ".github/workflows/sync-data.yml"

permissions:
  contents: write

concurrency:
  group: wxq-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Test live probe parser
        run: python3 scripts/test_sync_probe_parser.py
      - name: Sync upstream and live reference
        run: python3 scripts/sync_data.py
      - name: Validate merged catalog and relations
        run: python3 scripts/validate_data.py
      - name: Commit changed snapshots or live reference
        shell: bash
        run: |
          if git diff --quiet -- data/catalog data/manifest.json; then
            echo "No catalog or live-reference changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog data/manifest.json
          git commit -m "data: sync catalog and live reference"
          git push
