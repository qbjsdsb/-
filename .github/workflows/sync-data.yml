name: Sync game data

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sync upstream catalog
        run: python3 scripts/sync_data.py
      - name: Validate catalog
        run: python3 scripts/validate_data.py
      - name: Commit changed snapshots
        shell: bash
        run: |
          if git diff --quiet -- data/catalog data/manifest.json; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog data/manifest.json
          git commit -m "data: sync upstream catalog"
          git push
