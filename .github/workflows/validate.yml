name: Validate site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JSON catalog
        run: python3 scripts/validate_data.py
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Check required site files
        shell: bash
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f data/manifest.json
          grep -q 'assets/app.js' index.html
          grep -q '万象图鉴' index.html
