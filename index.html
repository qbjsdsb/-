<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B0D10">
  <meta name="description" content="王者万象棋资料、阵容、版本与构筑关系工具。">
  <title>万象图鉴 · 王者万象棋</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#/home" aria-label="万象图鉴首页">
      <span class="brand-mark">WX</span>
      <span><strong>万象图鉴</strong><small>TACTICAL CODEX</small></span>
    </a>

    <nav class="primary-nav" aria-label="主导航">
      <a href="#/home" data-nav="home"><span class="nav-icon">⌂</span><span>首页</span></a>
      <a href="#/library/heroes" data-nav="library"><span class="nav-icon">◇</span><span>资料库</span></a>
      <a href="#/comps" data-nav="comps"><span class="nav-icon">▦</span><span>阵容</span></a>
      <a href="#/version" data-nav="version"><span class="nav-icon">↺</span><span>版本</span></a>
      <a href="#/tools" data-nav="tools"><span class="nav-icon">⌘</span><span>工具</span></a>
    </nav>

    <div class="sidebar-context hidden" id="libraryContext">
      <div class="sidebar-label">资料类型</div>
      <nav id="librarySideNav" class="secondary-nav" aria-label="资料类型"></nav>
    </div>

    <div class="sidebar-foot">
      <button id="themeButton" type="button">切换主题</button>
      <a href="https://github.com/qbjsdsb/-" target="_blank" rel="noopener">GitHub ↗</a>
      <span id="sidebarVersion">加载版本…</span>
    </div>
  </aside>

  <section class="workspace">
    <header class="topbar">
      <a class="mobile-brand" href="#/home" aria-label="万象图鉴首页">万象图鉴</a>
      <button class="search-trigger" id="searchTrigger" type="button" aria-haspopup="dialog">
        <span class="search-icon">⌕</span>
        <span class="search-placeholder">搜索英雄、装备、天赋、阵容、机制…</span>
        <kbd>/</kbd>
      </button>
      <button class="version-pill" id="versionPill" type="button">v—</button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </section>
</div>

<nav class="mobile-nav" aria-label="移动端主导航">
  <a href="#/home" data-mobile-nav="home"><span>⌂</span><small>首页</small></a>
  <a href="#/library/heroes" data-mobile-nav="library"><span>◇</span><small>资料</small></a>
  <a href="#/comps" data-mobile-nav="comps"><span>▦</span><small>阵容</small></a>
  <a href="#/more" data-mobile-nav="more"><span>•••</span><small>更多</small></a>
</nav>

<dialog class="command-dialog" id="searchDialog">
  <div class="command-head">
    <span class="search-icon">⌕</span>
    <input id="globalSearchInput" autocomplete="off" placeholder="搜索英雄、装备、天赋、阵容、机制…" aria-label="全站搜索">
    <button id="searchClose" type="button" aria-label="关闭搜索">×</button>
  </div>
  <div class="command-hint">试试：云中君、牺牲、图腾、古币、复生</div>
  <div class="command-results" id="globalSearchResults"></div>
</dialog>

<div class="toast hidden" id="toast"></div>
<script type="module" src="./assets/app.js"></script>
</body>
</html>
